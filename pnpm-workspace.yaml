allowBuilds:
  esbuild: true
  workerd: true
  sharp: false
minimumReleaseAgeExclude:
  - shadcn-svelte@1.5.1
  - miniflare@5.20260826.0-alpha
  - wrangler@4.127.0
  - emdash
  - '@emdash-cms/*'
# Security: pin vulnerable transitive deps to patched versions within the same major.
overrides:
  devalue: ^5.9.3
  undici@>=7.0.0 <8.0.0: ^7.29.1
  undici@>=8.0.0 <9.0.0: ^8.10.2
  fast-uri@>=3.0.0 <4.0.0: ^3.1.9
  http-cache-semantics: ^4.3.0
  source-map-js: ^1.2.2
  sharp: ^0.35.5
  vite: ~8.2.4
  smol-toml: ^1.9.0
  sanitize-html: ^2.18.1
  brace-expansion@>=5.0.0 <6.0.0: ^5.0.12
  postcss-selector-parser@>=7.0.0 <8.0.0: ^7.1.6
